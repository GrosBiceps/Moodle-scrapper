<!doctype html>
<meta charset="utf-8">
<title>Course Downloader for Moodle™ — synchro</title>
<link rel="icon" href="icons/icon48.png">
<style>
  :root{--bg:#fff;--fg:#111827;--mut:#6b7280;--bd:#d1d5db;--acc:#f98012;--card:#f9fafb}
  @media (prefers-color-scheme:dark){:root{--bg:#111827;--fg:#f3f4f6;--mut:#9ca3af;--bd:#374151;--card:#1f2937}}
  body{font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:720px;margin:2em auto;padding:0 16px}
  h1{display:flex;gap:8px;align-items:center;font-size:20px}
  h1 img{width:28px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
  button{padding:8px 14px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:14px}
  button.main{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
  #track{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
  #bar{height:100%;width:0;background:var(--acc);transition:width .2s}
  #log{font:12px ui-monospace,monospace;color:var(--mut);max-height:260px;overflow:auto;white-space:pre-wrap}
  .mut{color:var(--mut)}
  #err{color:#dc2626}
</style>
<h1><img src="icons/icon48.png" alt="">Course Downloader for Moodle™</h1>
<div class="card">
  <b>Dossier de destination</b>
  <p id="dir" class="mut">Aucun dossier choisi.</p>
  <button id="pick">Choisir un dossier…</button>
  <p class="mut">Les fichiers sont écrits directement dans ce dossier, sans boîte « Enregistrer sous ».
    Un dossier Google Drive pour ordinateur fonctionne aussi.</p>
</div>
<div class="card" id="startCard" hidden>
  <b id="pendingTxt"></b>
  <p><button class="main" id="start">Démarrer la synchro</button></p>
</div>
<div class="card" id="runCard" hidden>
  <div id="phase"></div>
  <div id="track"><div id="bar"></div></div>
  <div id="stats" class="mut"></div>
  <p class="mut">Garde cet onglet et l'onglet Moodle ouverts pendant la synchro.</p>
  <div id="log"></div>
</div>
<p id="err"></p>
<script src="idb.js"></script>
<script src="engine.js"></script>
<script src="sync.js"></script>
